<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="treeBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#090d16" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>

    <!-- Branch Gradients -->
    <linearGradient id="branchRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="branchGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="branchBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="branchPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="nodeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      @keyframes energyPulse {
        to { stroke-dashoffset: -32; }
      }
      @keyframes coreGlow {
        0%, 100% { stroke-opacity: 0.4; }
        50% { stroke-opacity: 1.0; }
      }
      .anim-stream-red { stroke-dasharray: 6 6; animation: energyPulse 2.2s linear infinite; }
      .anim-stream-green { stroke-dasharray: 6 6; animation: energyPulse 2.6s linear infinite; }
      .anim-stream-blue { stroke-dasharray: 6 6; animation: energyPulse 2.4s linear infinite; }
      .anim-stream-purple { stroke-dasharray: 6 6; animation: energyPulse 2.8s linear infinite; }
      .anim-core { animation: coreGlow 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="480" fill="url(#treeBg)" rx="16"/>

  <!-- Subtle Matrix Pattern Grid -->
  <g opacity="0.12" stroke="#475569" stroke-width="0.75" stroke-dasharray="2 6">
    <path d="M 0 80 L 1200 80 M 0 160 L 1200 160 M 0 240 L 1200 240 M 0 320 L 1200 320 M 0 400 L 1200 400"/>
    <path d="M 200 0 L 200 480 M 400 0 L 400 480 M 600 0 L 600 480 M 800 0 L 800 480 M 1000 0 L 1000 480"/>
  </g>

  <!-- Title Header Inside SVG -->
  <g transform="translate(600, 24)">
    <text x="0" y="0" fill="#64748b" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" text-anchor="middle" letter-spacing="4">
      TACTICAL MATCH ARBITRATION TREE
    </text>
  </g>

  <!-- ==================== CONNECTING GLOWING BRANCH PATHS ==================== -->
  <g fill="none">
    <!-- Static Base Backing Paths -->
    <path d="M 260 240 C 380 240, 420 75, 590 75" stroke="#334155" stroke-width="3"/>
    <path d="M 260 240 C 380 240, 420 185, 590 185" stroke="#334155" stroke-width="3"/>
    <path d="M 260 240 C 380 240, 420 295, 590 295" stroke="#334155" stroke-width="3"/>
    <path d="M 260 240 C 380 240, 420 405, 590 405" stroke="#334155" stroke-width="3"/>

    <!-- Animated Glowing Energy Streams -->
    <path d="M 260 240 C 380 240, 420 75, 590 75" stroke="url(#branchRed)" stroke-width="2.5" class="anim-stream-red"/>
    <path d="M 260 240 C 380 240, 420 185, 590 185" stroke="url(#branchGreen)" stroke-width="2.5" class="anim-stream-green"/>
    <path d="M 260 240 C 380 240, 420 295, 590 295" stroke="url(#branchBlue)" stroke-width="2.5" class="anim-stream-blue"/>
    <path d="M 260 240 C 380 240, 420 405, 590 405" stroke="url(#branchPurple)" stroke-width="2.5" class="anim-stream-purple"/>
  </g>

  <!-- ==================== LEFT ROOT: SELECT GAME MODE DIAMOND ==================== -->
  <g transform="translate(140, 240)" filter="url(#nodeShadow)">
    <!-- Outer Diamond -->
    <polygon points="0,-75 95,0 0,75 -95,0" fill="#0f172a" stroke="#f59e0b" stroke-width="2" class="anim-core"/>
    <!-- Inner Accent Diamond -->
    <polygon points="0,-60 76,0 0,60 -76,0" fill="#1e293b" fill-opacity="0.6" stroke="#fbbf24" stroke-width="1"/>
    
    <text x="0" y="-14" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1">
      MATCH SETUP
    </text>
    <text x="0" y="8" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="15" font-weight="900" text-anchor="middle">
      Select Mode
    </text>
    <text x="0" y="26" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">
      Lobby Ruleset
    </text>
  </g>

  <!-- ==================== RIGHT LEAF NODES (4 OFFICIAL MODES) ==================== -->

  <!-- NODE 1: HP DEATHMATCH (y = 75) -->
  <g transform="translate(590, 35)" filter="url(#nodeShadow)">
    <rect width="570" height="80" rx="12" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="80" rx="5" fill="#ef4444"/>
    <text x="25" y="28" fill="#fca5a5" font-family="'Inter', sans-serif" font-size="14.5" font-weight="900">
      01. HP DEATHMATCH (HP) • SURVIVAL ELIMINATION
    </text>
    <text x="25" y="48" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="12" font-weight="600">
      Score points convert into lethal damage dealt to living rivals.
    </text>
    <text x="25" y="66" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11.5">
      1.0s Shield Reaction Window • 7 Tactical Cards • 0 HP Elimination Demotion
    </text>
  </g>

  <!-- NODE 2: TURN COUNT (y = 185) -->
  <g transform="translate(590, 145)" filter="url(#nodeShadow)">
    <rect width="570" height="80" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="80" rx="5" fill="#10b981"/>
    <text x="25" y="28" fill="#6ee7b7" font-family="'Inter', sans-serif" font-size="14.5" font-weight="900">
      02. TURN COUNT (TURNS) • QUICK PLAY SPRINT
    </text>
    <text x="25" y="48" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="12" font-weight="600">
      Fixed turn limit (7 to 500 rounds). Cumulative score decides victor.
    </text>
    <text x="25" y="66" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11.5">
      No Damage • Power Cards Excluded • Maximum 3L / 2L &amp; Bingo Yield
    </text>
  </g>

  <!-- NODE 3: CLASSIC TOURNAMENT (y = 295) -->
  <g transform="translate(590, 255)" filter="url(#nodeShadow)">
    <rect width="570" height="80" rx="12" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="80" rx="5" fill="#0ea5e9"/>
    <text x="25" y="28" fill="#7dd3fc" font-family="'Inter', sans-serif" font-size="14.5" font-weight="900">
      03. CLASSIC TOURNAMENT (CLASSIC) • SCRABBLE STANDARD
    </text>
    <text x="25" y="48" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="12" font-weight="600">
      Standard 100-tile tournament bag exhaustion rules.
    </text>
    <text x="25" y="66" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11.5">
      No Power Cards • CSW24 Lexicon • 50-Point Bingo Priority • Rated Scrabble
    </text>
  </g>

  <!-- NODE 4: FANCY BLOOD ARENA (y = 405) -->
  <g transform="translate(590, 365)" filter="url(#nodeShadow)">
    <rect width="570" height="80" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="80" rx="5" fill="#a855f7"/>
    <text x="25" y="28" fill="#c084fc" font-family="'Inter', sans-serif" font-size="14.5" font-weight="900">
      04. FANCY ARENA (FANCY) • HIGH HP CHAOS
    </text>
    <text x="25" y="48" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="12" font-weight="600">
      150 Base HP. Players automatically draw 1 random tactical spell every turn.
    </text>
    <text x="25" y="66" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11.5">
      Board Power Cells Not Needed • Auto-Draw Capped at 3 Cards • Maximum Combat
    </text>
  </g>
</svg>
