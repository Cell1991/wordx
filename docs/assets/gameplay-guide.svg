<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="guideBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0b132b" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#070c1d" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>

    <!-- Step Gradients -->
    <linearGradient id="stepGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="stepGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="stepGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="stepGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="stepGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="stepGrad6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="guideShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <style>
      @keyframes guidePulse {
        to { stroke-dashoffset: -32; }
      }
      @keyframes stepBlink {
        0%, 100% { stroke-opacity: 0.4; }
        50% { stroke-opacity: 1.0; }
      }
      .anim-stream { stroke-dasharray: 6 6; animation: guidePulse 2.8s linear infinite; }
      .anim-step-box { animation: stepBlink 4.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="320" fill="url(#guideBg)" rx="16"/>

  <!-- Top Title / HUD Header -->
  <g transform="translate(600, 26)">
    <text x="0" y="0" fill="#64748b" font-family="'Inter', sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="4">
      MASTER COMBAT PLAYBOOK • 6-PHASE PLAYER JOURNEY
    </text>
    <text x="0" y="24" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="17" font-weight="900" text-anchor="middle" letter-spacing="1">
      How To Play: Tactical Turn Execution &amp; Elimination Sequence
    </text>
  </g>

  <!-- Connecting Stream Line -->
  <line x1="80" y1="180" x2="1120" y2="180" stroke="#1e293b" stroke-width="3"/>
  <line x1="80" y1="180" x2="1120" y2="180" stroke="#38bdf8" stroke-width="2" class="anim-stream" opacity="0.6"/>

  <!-- ==================== 6 PHASES SIDE-BY-SIDE ==================== -->

  <!-- PHASE 1: LOBBY & SEAT SETUP -->
  <g transform="translate(25, 75)" filter="url(#guideShadow)">
    <rect width="180" height="215" rx="12" fill="url(#stepGrad1)" stroke="#0284c7" stroke-width="1.5" class="anim-step-box"/>
    <rect x="0" y="0" width="180" height="28" rx="12" fill="#0369a1" fill-opacity="0.4"/>
    <text x="90" y="19" fill="#7dd3fc" font-family="'Inter', sans-serif" font-size="10.5" font-weight="900" text-anchor="middle">PHASE 01 • LOBBY</text>
    <circle cx="90" cy="58" r="20" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="90" y="63" fill="#38bdf8" font-family="'Inter', monospace" font-size="13" font-weight="900" text-anchor="middle">01</text>
    <text x="90" y="100" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13.5" font-weight="900" text-anchor="middle">Create or Join</text>
    <text x="90" y="122" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="500" text-anchor="middle">
      <tspan x="90" dy="0">6-Digit PIN Match</tspan>
      <tspan x="90" dy="16">1-4 Players or AI Bot</tspan>
      <tspan x="90" dy="16">Draw 7 Starter Tiles</tspan>
      <tspan x="90" dy="16">Hidden Rack Encryption</tspan>
    </text>
  </g>

  <!-- PHASE 2: OPENING & ANCHORING -->
  <g transform="translate(217, 75)" filter="url(#guideShadow)">
    <rect width="180" height="215" rx="12" fill="url(#stepGrad2)" stroke="#10b981" stroke-width="1.5" class="anim-step-box"/>
    <rect x="0" y="0" width="180" height="28" rx="12" fill="#065f46" fill-opacity="0.4"/>
    <text x="90" y="19" fill="#6ee7b7" font-family="'Inter', sans-serif" font-size="10.5" font-weight="900" text-anchor="middle">PHASE 02 • ANCHOR</text>
    <circle cx="90" cy="58" r="20" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="90" y="63" fill="#10b981" font-family="'Inter', monospace" font-size="13" font-weight="900" text-anchor="middle">02</text>
    <text x="90" y="100" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13.5" font-weight="900" text-anchor="middle">Star Center Move</text>
    <text x="90" y="122" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="500" text-anchor="middle">
      <tspan x="90" dy="0">Move 1 must cover (9,13)</tspan>
      <tspan x="90" dy="16">Minimum 2 letters long</tspan>
      <tspan x="90" dy="16">Linear Horizontal/Vertical</tspan>
      <tspan x="90" dy="16">Future words connect</tspan>
    </text>
  </g>

  <!-- PHASE 3: MULTIPLIERS & BINGO -->
  <g transform="translate(409, 75)" filter="url(#guideShadow)">
    <rect width="180" height="215" rx="12" fill="url(#stepGrad3)" stroke="#f59e0b" stroke-width="1.5" class="anim-step-box"/>
    <rect x="0" y="0" width="180" height="28" rx="12" fill="#78350f" fill-opacity="0.4"/>
    <text x="90" y="19" fill="#fde68a" font-family="'Inter', sans-serif" font-size="10.5" font-weight="900" text-anchor="middle">PHASE 03 • MULTIPLY</text>
    <circle cx="90" cy="58" r="20" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="90" y="63" fill="#fbbf24" font-family="'Inter', monospace" font-size="13" font-weight="900" text-anchor="middle">03</text>
    <text x="90" y="100" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13.5" font-weight="900" text-anchor="middle">2L, 3L &amp; +50 Bingo</text>
    <text x="90" y="122" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="500" text-anchor="middle">
      <tspan x="90" dy="0">3L Triples Tile Value</tspan>
      <tspan x="90" dy="16">2L Doubles Tile Value</tspan>
      <tspan x="90" dy="16">All 7 tiles = +50 Pts</tspan>
      <tspan x="90" dy="16">Orthogonal Crosswords</tspan>
    </text>
  </g>

  <!-- PHASE 4: SECRET POWER DROP -->
  <g transform="translate(601, 75)" filter="url(#guideShadow)">
    <rect width="180" height="215" rx="12" fill="url(#stepGrad4)" stroke="#a855f7" stroke-width="1.5" class="anim-step-box"/>
    <rect x="0" y="0" width="180" height="28" rx="12" fill="#581c87" fill-opacity="0.4"/>
    <text x="90" y="19" fill="#e9d5ff" font-family="'Inter', sans-serif" font-size="10.5" font-weight="900" text-anchor="middle">PHASE 04 • SPELLS</text>
    <circle cx="90" cy="58" r="20" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
    <text x="90" y="63" fill="#c084fc" font-family="'Inter', monospace" font-size="13" font-weight="900" text-anchor="middle">04</text>
    <text x="90" y="100" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13.5" font-weight="900" text-anchor="middle">Secret Power (⚡)</text>
    <text x="90" y="122" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="500" text-anchor="middle">
      <tspan x="90" dy="0">Cover ⚡ Cell to Draw</tspan>
      <tspan x="90" dy="16">Hold Up To 3 Cards</tspan>
      <tspan x="90" dy="16">Freeze, Destroy, Heal</tspan>
      <tspan x="90" dy="16">2X Damage &amp; Spy Swap</tspan>
    </text>
  </g>

  <!-- PHASE 5: SHIELD REACTION -->
  <g transform="translate(793, 75)" filter="url(#guideShadow)">
    <rect width="180" height="215" rx="12" fill="url(#stepGrad5)" stroke="#ef4444" stroke-width="1.5" class="anim-step-box"/>
    <rect x="0" y="0" width="180" height="28" rx="12" fill="#991b1b" fill-opacity="0.4"/>
    <text x="90" y="19" fill="#fca5a5" font-family="'Inter', sans-serif" font-size="10.5" font-weight="900" text-anchor="middle">PHASE 05 • REACTION</text>
    <circle cx="90" cy="58" r="20" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="90" y="63" fill="#ef4444" font-family="'Inter', monospace" font-size="13" font-weight="900" text-anchor="middle">05</text>
    <text x="90" y="100" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13.5" font-weight="900" text-anchor="middle">1.0s Shield Timing</text>
    <text x="90" y="122" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="500" text-anchor="middle">
      <tspan x="90" dy="0">Lethal Hit Incoming</tspan>
      <tspan x="90" dy="16">1.0-Sec Countdown</tspan>
      <tspan x="90" dy="16">Pop SHIELD to Block</tspan>
      <tspan x="90" dy="16">Prevents Hit &amp; Swap</tspan>
    </text>
  </g>

  <!-- PHASE 6: ELIMINATION & VICTORY -->
  <g transform="translate(985, 75)" filter="url(#guideShadow)">
    <rect width="190" height="215" rx="12" fill="url(#stepGrad6)" stroke="#f43f5e" stroke-width="1.5" class="anim-step-box"/>
    <rect x="0" y="0" width="190" height="28" rx="12" fill="#881337" fill-opacity="0.4"/>
    <text x="95" y="19" fill="#fda4af" font-family="'Inter', sans-serif" font-size="10.5" font-weight="900" text-anchor="middle">PHASE 06 • VICTORY</text>
    <circle cx="95" cy="58" r="20" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="95" y="63" fill="#f43f5e" font-family="'Inter', monospace" font-size="13" font-weight="900" text-anchor="middle">06</text>
    <text x="95" y="100" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13.5" font-weight="900" text-anchor="middle">Last Survivor Wins</text>
    <text x="95" y="122" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="500" text-anchor="middle">
      <tspan x="95" dy="0">0 HP = Knocked Out</tspan>
      <tspan x="95" dy="16">Demoted to Spectator</tspan>
      <tspan x="95" dy="16">Survivor Claims Victory</tspan>
      <tspan x="95" dy="16">1-Click Rematch Lobby</tspan>
    </text>
  </g>
</svg>
