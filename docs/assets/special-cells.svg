<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="cellsBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#091026" stop-opacity="0.98"/>
      <stop offset="60%" stop-color="#050a1c" stop-opacity="0.99"/>
      <stop offset="100%" stop-color="#02040e" stop-opacity="1"/>
    </radialGradient>

    <!-- In-Game 3L Fire Cell Gradient (Glossy Red) -->
    <linearGradient id="cell3LGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="35%" stop-color="#dc2626"/>
      <stop offset="70%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>

    <!-- In-Game 2L Earth Cell Gradient (Glossy Green) -->
    <linearGradient id="cell2LGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="35%" stop-color="#16a34a"/>
      <stop offset="70%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>

    <!-- In-Game Power Cell Gradient (Cyan Gem) -->
    <linearGradient id="cellPowerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="30%" stop-color="#22d3ee"/>
      <stop offset="70%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <!-- Center Star Gradient -->
    <linearGradient id="cellCenterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Top Gloss Highlight -->
    <linearGradient id="glossHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <style>
      @keyframes cellPulse {
        0%, 100% { filter: drop-shadow(0 0 5px #22d3ee); opacity: 0.92; }
        50% { filter: drop-shadow(0 0 14px #38bdf8); opacity: 1.0; }
      }
      @keyframes starPulse {
        0%, 100% { filter: drop-shadow(0 0 4px #fbbf24); }
        50% { filter: drop-shadow(0 0 11px #f59e0b); }
      }
      .anim-power { animation: cellPulse 3.5s ease-in-out infinite; }
      .anim-star { animation: starPulse 3.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="320" fill="url(#cellsBg)" rx="16"/>

  <!-- Top Title / HUD Header -->
  <g transform="translate(600, 26)">
    <text x="0" y="0" fill="#64748b" font-family="'Inter', sans-serif" font-size="10.5" font-weight="900" text-anchor="middle" letter-spacing="4">
      19×27 MATRIX TOPOLOGY • SPECIAL SQUARES &amp; TRIGGER RULES
    </text>
    <text x="0" y="24" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="17" font-weight="900" text-anchor="middle" letter-spacing="1">
      Special Cell Mechanics, Multipliers &amp; Secret Power Drop
    </text>
  </g>

  <!-- ==================== 4 SPECIAL CELLS SIDE-BY-SIDE ==================== -->

  <!-- CELL 1: CENTER STAR ANCHOR -->
  <g transform="translate(30, 75)" filter="url(#boxShadow)">
    <rect width="265" height="215" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="32" rx="12" fill="#78350f" fill-opacity="0.4"/>
    <text x="132" y="21" fill="#fde68a" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" text-anchor="middle">CENTER STAR ANCHOR</text>

    <!-- Exact In-Game Center Star Badge -->
    <g transform="translate(102, 48)" class="anim-star">
      <rect width="60" height="52" rx="8" fill="url(#cellCenterGrad)" stroke="#fbbf24" stroke-width="2"/>
      <rect width="60" height="24" rx="7" fill="url(#glossHighlight)"/>
      <text x="30" y="37" fill="#fbbf24" font-size="30" text-anchor="middle">★</text>
    </g>

    <text x="132" y="126" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="14.5" font-weight="900" text-anchor="middle">Coordinate (Row 9, Col 13)</text>
    <text x="132" y="148" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11.5" font-weight="500" text-anchor="middle">
      <tspan x="132" dy="0">Mandatory Opening Move Anchor</tspan>
      <tspan x="132" dy="16">First word of match must cover this</tspan>
      <tspan x="132" dy="16">Unlocks entire 19×27 battleground</tspan>
    </text>
  </g>

  <!-- CELL 2: TRIPLE LETTER (3L FIRE) -->
  <g transform="translate(320, 75)" filter="url(#boxShadow)">
    <rect width="265" height="215" rx="12" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="32" rx="12" fill="#991b1b" fill-opacity="0.4"/>
    <text x="132" y="21" fill="#fca5a5" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" text-anchor="middle">TRIPLE LETTER (3L)</text>

    <!-- Exact In-Game 3L Fire Badge -->
    <g transform="translate(102, 48)">
      <rect width="60" height="52" rx="8" fill="url(#cell3LGrad)" stroke="#f87171" stroke-width="1.8"/>
      <rect width="60" height="24" rx="7" fill="url(#glossHighlight)"/>
      <text x="30" y="35" fill="#ffffff" font-family="'Inter', sans-serif" font-size="22" font-weight="900" font-style="italic" text-anchor="middle">3L</text>
    </g>

    <text x="132" y="126" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="14.5" font-weight="900" text-anchor="middle">3× Score Multiplier</text>
    <text x="132" y="148" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11.5" font-weight="500" text-anchor="middle">
      <tspan x="132" dy="0">Triples placed tile point value</tspan>
      <tspan x="132" dy="16">Applies to all intersecting words</tspan>
      <tspan x="132" dy="16">Located in 8 symmetric matrix cells</tspan>
    </text>
  </g>

  <!-- CELL 3: DOUBLE LETTER (2L EARTH) -->
  <g transform="translate(610, 75)" filter="url(#boxShadow)">
    <rect width="265" height="215" rx="12" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="32" rx="12" fill="#065f46" fill-opacity="0.4"/>
    <text x="132" y="21" fill="#86efac" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" text-anchor="middle">DOUBLE LETTER (2L)</text>

    <!-- Exact In-Game 2L Earth Badge -->
    <g transform="translate(102, 48)">
      <rect width="60" height="52" rx="8" fill="url(#cell2LGrad)" stroke="#4ade80" stroke-width="1.8"/>
      <rect width="60" height="24" rx="7" fill="url(#glossHighlight)"/>
      <text x="30" y="35" fill="#ffffff" font-family="'Inter', sans-serif" font-size="22" font-weight="900" font-style="italic" text-anchor="middle">2L</text>
    </g>

    <text x="132" y="126" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="14.5" font-weight="900" text-anchor="middle">2× Score Multiplier</text>
    <text x="132" y="148" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11.5" font-weight="500" text-anchor="middle">
      <tspan x="132" dy="0">Doubles placed tile point value</tspan>
      <tspan x="132" dy="16">Stepping stone for word extensions</tspan>
      <tspan x="132" dy="16">Located in 12 strategic board cells</tspan>
    </text>
  </g>

  <!-- CELL 4: SECRET POWER SQUARE (⚡) -->
  <g transform="translate(900, 75)" filter="url(#boxShadow)">
    <rect width="265" height="215" rx="12" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="32" rx="12" fill="#0891b2" fill-opacity="0.4"/>
    <text x="132" y="21" fill="#7dd3fc" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" text-anchor="middle">SECRET POWER SQUARE</text>

    <!-- Exact In-Game Power Cell Badge -->
    <g transform="translate(102, 48)" class="anim-power">
      <rect width="60" height="52" rx="10" fill="url(#cellPowerGrad)" stroke="#38bdf8" stroke-width="2"/>
      <rect width="60" height="24" rx="8" fill="url(#glossHighlight)"/>
      <text x="30" y="37" fill="#facc15" font-size="30" font-weight="900" text-anchor="middle">⚡</text>
    </g>

    <text x="132" y="126" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="14.5" font-weight="900" text-anchor="middle">Tactical Card Drop</text>
    <text x="132" y="148" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11.5" font-weight="500" text-anchor="middle">
      <tspan x="132" dy="0">Cover cell to draw tactical card</tspan>
      <tspan x="132" dy="16">Maximum 3 cards held in hand</tspan>
      <tspan x="132" dy="16">Triggers 1 of 7 tactical spells</tspan>
    </text>
  </g>
</svg>
