<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 288 284" width="100%" height="100%">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="avatarClip">
      <circle cx="140" cy="72" r="44"/>
    </clipPath>
    <filter id="textShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>
  <g transform="translate(4, 4)">
    <!-- Card Surface -->
    <rect x="0" y="0" width="280" height="276" rx="16" fill="#0b1120" stroke="url(#borderGrad)" stroke-width="1.6"/>
    <rect x="1" y="1" width="278" height="274" rx="15" fill="none" stroke="#f97316" stroke-width="0.5" opacity="0.25"/>
    <path d="M 32 0 L 248 0" stroke="#f97316" stroke-width="3.2" stroke-linecap="round" opacity="0.95"/>
    <text x="262" y="28" fill="#64748b" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI Mono', monospace" font-size="12.5" font-weight="800" text-anchor="end">07</text>

    <!-- Multi-Ring Profile Avatar (88px Diameter) -->
    <circle cx="140" cy="72" r="50" fill="#f97316" opacity="0.16"/>
    <circle cx="140" cy="72" r="49" fill="none" stroke="#f97316" stroke-width="1.4" stroke-dasharray="22 6 4 6" opacity="0.8"/>
    <circle cx="140" cy="72" r="44" fill="#0f172a"/>
    <image href="data:image/png;base64," x="96" y="28" width="88" height="88" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>
    <circle cx="140" cy="72" r="44" fill="none" stroke="#030712" stroke-width="2" opacity="0.6"/>
    <circle cx="140" cy="72" r="45" fill="none" stroke="url(#ringGrad)" stroke-width="2.6"/>
    <circle cx="171" cy="103" r="6.5" fill="#0b1120"/>
    <circle cx="171" cy="103" r="4.5" fill="#fb923c"/>

    <!-- Student Full Name -->
    <text x="140" y="156" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="900" text-anchor="middle" filter="url(#textShadow)">Thanadet Suksomphong</text>

    <!-- Clean Role Pill -->
    <g transform="translate(56, 172)">
      <rect x="0" y="0" width="168" height="28" rx="14" fill="#f97316" fill-opacity="0.14" stroke="#f97316" stroke-opacity="0.45" stroke-width="1"/>
      <text x="84" y="19" fill="#e2e8f0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">System Testing</text>
    </g>

    <!-- Student ID Pill -->
    <g transform="translate(38, 214)">
      <rect x="0" y="0" width="204" height="42" rx="21" fill="#030712" stroke="#f97316" stroke-width="1.6" opacity="0.98"/>
      <text x="102" y="27" fill="#fb923c" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI Mono', monospace" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="2.5">66312206</text>
    </g>
  </g>
</svg>
