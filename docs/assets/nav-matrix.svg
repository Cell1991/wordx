<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="navBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#090d16" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>

    <!-- Glowing Drop Shadow Filter -->
    <filter id="navGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      @keyframes dashMove {
        to { stroke-dashoffset: -32; }
      }
      .stream-anim { stroke-dasharray: 6 6; animation: dashMove 3s linear infinite; }
    </style>
  </defs>

  <!-- Container Base -->
  <rect width="1200" height="240" fill="url(#navBg)" rx="16"/>

  <!-- Top Title / HUD Header -->
  <g transform="translate(600, 26)">
    <text x="0" y="0" fill="#64748b" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="4">
      CROSSWORD BATTLE ARENA • TACTICAL NAVIGATION SITEMAP
    </text>
  </g>

  <!-- Central Bus / Grid Lines -->
  <path d="M 60 115 L 1140 115" stroke="#1e293b" stroke-width="2"/>
  <path d="M 60 115 L 1140 115" stroke="#38bdf8" stroke-width="1.5" class="stream-anim" opacity="0.4"/>

  <!-- ==================== ROW 1 (TOP 5 CARDS) ==================== -->
  
  <!-- 1. BENTO GRID -->
  <g transform="translate(30, 42)" filter="url(#navGlow)">
    <rect width="215" height="70" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="0" y="0" width="215" height="24" rx="10" fill="#0369a1" fill-opacity="0.3"/>
    <text x="12" y="16" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="11" font-weight="900" letter-spacing="0.5">01. BENTO GRID</text>
    <text x="12" y="44" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="800">Feature Matrix</text>
    <text x="12" y="58" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10.5" font-weight="500">60 FPS Canvas • Capabilities</text>
  </g>

  <!-- 2. HOW TO PLAY -->
  <g transform="translate(265, 42)" filter="url(#navGlow)">
    <rect width="215" height="70" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    <rect x="0" y="0" width="215" height="24" rx="10" fill="#065f46" fill-opacity="0.3"/>
    <text x="12" y="16" fill="#6ee7b7" font-family="'Inter', sans-serif" font-size="11" font-weight="900" letter-spacing="0.5">02. HOW TO PLAY</text>
    <text x="12" y="44" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="800">Combat Playbook</text>
    <text x="12" y="58" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10.5" font-weight="500">6-Step Flow • Anchor Rules</text>
  </g>

  <!-- 3. GAME MODES -->
  <g transform="translate(500, 42)" filter="url(#navGlow)">
    <rect width="200" height="70" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="1.2"/>
    <rect x="0" y="0" width="200" height="24" rx="10" fill="#991b1b" fill-opacity="0.3"/>
    <text x="12" y="16" fill="#fca5a5" font-family="'Inter', sans-serif" font-size="11" font-weight="900" letter-spacing="0.5">03. GAME MODES</text>
    <text x="12" y="44" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="800">4 Official Modes</text>
    <text x="12" y="58" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10.5" font-weight="500">HP • Classic • Sprint • Fancy</text>
  </g>

  <!-- 4. POWER CARDS -->
  <g transform="translate(720, 42)" filter="url(#navGlow)">
    <rect width="215" height="70" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
    <rect x="0" y="0" width="215" height="24" rx="10" fill="#78350f" fill-opacity="0.3"/>
    <text x="12" y="16" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="11" font-weight="900" letter-spacing="0.5">04. POWER CARDS</text>
    <text x="12" y="44" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="800">7 Combat Spells</text>
    <text x="12" y="58" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10.5" font-weight="500">Shield • Freeze • 2X Damage</text>
  </g>

  <!-- 5. MATRIX TOPOLOGY -->
  <g transform="translate(955, 42)" filter="url(#navGlow)">
    <rect width="215" height="70" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.2"/>
    <rect x="0" y="0" width="215" height="24" rx="10" fill="#0e7490" fill-opacity="0.3"/>
    <text x="12" y="16" fill="#7dd3fc" font-family="'Inter', sans-serif" font-size="11" font-weight="900" letter-spacing="0.5">05. 19×27 MATRIX</text>
    <text x="12" y="44" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="800">Grid &amp; Multipliers</text>
    <text x="12" y="58" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10.5" font-weight="500">3L / 2L / ⚡ Special Cells</text>
  </g>

  <!-- ==================== ROW 2 (BOTTOM 5 CARDS) ==================== -->

  <!-- 6. MULTIPLAYER & AI -->
  <g transform="translate(30, 140)" filter="url(#navGlow)">
    <rect width="215" height="70" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.2"/>
    <rect x="0" y="0" width="215" height="24" rx="10" fill="#3730a3" fill-opacity="0.3"/>
    <text x="12" y="16" fill="#c7d2fe" font-family="'Inter', sans-serif" font-size="11" font-weight="900" letter-spacing="0.5">06. MULTIPLAYER &amp; AI</text>
    <text x="12" y="44" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="800">Live Sync &amp; Bots</text>
    <text x="12" y="58" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10.5" font-weight="500">AI Triad • Spectator Feeds</text>
  </g>

  <!-- 7. ARCHITECTURE -->
  <g transform="translate(265, 140)" filter="url(#navGlow)">
    <rect width="215" height="70" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="0" y="0" width="215" height="24" rx="10" fill="#0369a1" fill-opacity="0.3"/>
    <text x="12" y="16" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="11" font-weight="900" letter-spacing="0.5">07. ARCHITECTURE</text>
    <text x="12" y="44" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="800">Full-Stack Dataflow</text>
    <text x="12" y="58" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10.5" font-weight="500">FastAPI • Next.js 16 • SQL</text>
  </g>

  <!-- 8. DATABASE ERD -->
  <g transform="translate(500, 140)" filter="url(#navGlow)">
    <rect width="200" height="70" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.2"/>
    <rect x="0" y="0" width="200" height="24" rx="10" fill="#581c87" fill-opacity="0.3"/>
    <text x="12" y="16" fill="#c084fc" font-family="'Inter', sans-serif" font-size="11" font-weight="900" letter-spacing="0.5">08. DATABASE ERD</text>
    <text x="12" y="44" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="800">Schema Relational</text>
    <text x="12" y="58" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10.5" font-weight="500">Game • Room • Moves</text>
  </g>

  <!-- 9. QUICK START -->
  <g transform="translate(720, 140)" filter="url(#navGlow)">
    <rect width="215" height="70" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    <rect x="0" y="0" width="215" height="24" rx="10" fill="#065f46" fill-opacity="0.3"/>
    <text x="12" y="16" fill="#6ee7b7" font-family="'Inter', sans-serif" font-size="11" font-weight="900" letter-spacing="0.5">09. QUICK START</text>
    <text x="12" y="44" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="800">1-Click Docker</text>
    <text x="12" y="58" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10.5" font-weight="500">Docker Compose &amp; SQLite</text>
  </g>

  <!-- 10. API & WEBSOCKET -->
  <g transform="translate(955, 140)" filter="url(#navGlow)">
    <rect width="215" height="70" rx="10" fill="#0f172a" stroke="#f43f5e" stroke-width="1.2"/>
    <rect x="0" y="0" width="215" height="24" rx="10" fill="#9f1239" fill-opacity="0.3"/>
    <text x="12" y="16" fill="#fda4af" font-family="'Inter', sans-serif" font-size="11" font-weight="900" letter-spacing="0.5">10. API &amp; WEBSOCKET</text>
    <text x="12" y="44" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="800">REST Endpoints</text>
    <text x="12" y="58" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10.5" font-weight="500">OpenAPI • Event Stream</text>
  </g>
</svg>
