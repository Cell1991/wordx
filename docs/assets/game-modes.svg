<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="modeHpBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="modeTurnsBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065f46" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="modeClassicBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="modeFancyBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- HP Bar Gradient -->
    <linearGradient id="hpBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="modeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      @keyframes pulseBorder {
        0%, 100% { stroke-opacity: 0.35; }
        50% { stroke-opacity: 0.95; }
      }
      @keyframes hpBarAnim {
        0%, 100% { width: 175px; }
        50% { width: 85px; }
      }
      .anim-pulse-red { animation: pulseBorder 5s ease-in-out infinite; }
      .anim-pulse-green { animation: pulseBorder 5.5s ease-in-out infinite 0.6s; }
      .anim-pulse-blue { animation: pulseBorder 6s ease-in-out infinite 1.2s; }
      .anim-pulse-purple { animation: pulseBorder 6.5s ease-in-out infinite 1.8s; }
      .anim-hp-deplete { animation: hpBarAnim 7s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="360" fill="#030712" rx="16"/>

  <!-- Top Title / HUD Header -->
  <g transform="translate(600, 24)">
    <text x="0" y="0" fill="#64748b" font-family="'Inter', sans-serif" font-size="10.5" font-weight="900" text-anchor="middle" letter-spacing="4">
      TACTICAL COMBAT MATRIX • 4 OFFICIAL GAME MODES
    </text>
  </g>

  <!-- ==================== 4 MODES SIDE-BY-SIDE ==================== -->

  <!-- CARD 1: HP DEATHMATCH (HP) -->
  <g transform="translate(25, 42)" filter="url(#modeShadow)">
    <rect width="265" height="300" rx="14" fill="url(#modeHpBg)" stroke="#ef4444" stroke-width="1.5" class="anim-pulse-red"/>
    <!-- Card Header Banner -->
    <rect x="0" y="0" width="265" height="40" rx="14" fill="#991b1b" fill-opacity="0.5"/>
    <text x="18" y="26" fill="#fca5a5" font-family="'Inter', sans-serif" font-size="13" font-weight="900" letter-spacing="1">
      HP DEATHMATCH
    </text>
    <rect x="175" y="9" width="76" height="22" rx="11" fill="#7f1d1d" stroke="#ef4444" stroke-width="1"/>
    <text x="213" y="23.5" fill="#fee2e2" font-family="'Inter', sans-serif" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">COMBAT</text>

    <!-- Subtitle -->
    <text x="18" y="66" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="14.5" font-weight="800">Survival Elimination</text>
    <text x="18" y="85" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11.5" font-weight="500">
      Word points inflict lethal rival damage.
    </text>

    <!-- Animated HP Bar Demo -->
    <g transform="translate(18, 104)">
      <rect width="225" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect width="175" height="18" x="3" y="3" rx="4" fill="url(#hpBarGrad)" class="anim-hp-deplete"/>
      <text x="112" y="16" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" text-anchor="middle" letter-spacing="1">
        HP: 75 / 100
      </text>
    </g>

    <!-- Feature Checklist -->
    <g transform="translate(18, 150)" font-family="'Inter', sans-serif" font-size="11.5" fill="#cbd5e1">
      <text y="0" font-weight="700" fill="#f87171">Direct Damage from Word Scores</text>
      <text y="22" fill="#94a3b8">1.0s Reactive Shield Reaction</text>
      <text y="44" fill="#94a3b8">Secret Power ⚡ Drops All 7 Cards</text>
      <text y="66" fill="#94a3b8">0 HP = Knockout to Spectator</text>
    </g>

    <!-- Bottom Tag -->
    <g transform="translate(18, 255)">
      <rect width="225" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="112" y="17" fill="#f87171" font-family="'Inter', sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">
        HP: 10 TO 1,000
      </text>
    </g>
  </g>

  <!-- CARD 2: TURN COUNT (TURNS) -->
  <g transform="translate(315, 42)" filter="url(#modeShadow)">
    <rect width="265" height="300" rx="14" fill="url(#modeTurnsBg)" stroke="#10b981" stroke-width="1.5" class="anim-pulse-green"/>
    <!-- Card Header Banner -->
    <rect x="0" y="0" width="265" height="40" rx="14" fill="#065f46" fill-opacity="0.5"/>
    <text x="18" y="26" fill="#6ee7b7" font-family="'Inter', sans-serif" font-size="13" font-weight="900" letter-spacing="1">
      TURN COUNT
    </text>
    <rect x="175" y="9" width="76" height="22" rx="11" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="213" y="23.5" fill="#d1fae5" font-family="'Inter', sans-serif" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">SPRINT</text>

    <!-- Subtitle -->
    <text x="18" y="66" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="14.5" font-weight="800">Quick Play Score Race</text>
    <text x="18" y="85" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11.5" font-weight="500">
      Fixed rounds. Highest score wins match.
    </text>

    <!-- Turn Pill Demo -->
    <g transform="translate(18, 104)">
      <rect width="225" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect width="130" height="18" x="3" y="3" rx="4" fill="#059669"/>
      <text x="112" y="16" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" text-anchor="middle" letter-spacing="1">
        ROUND 12 OF 28
      </text>
    </g>

    <!-- Feature Checklist -->
    <g transform="translate(18, 150)" font-family="'Inter', sans-serif" font-size="11.5" fill="#cbd5e1">
      <text y="0" font-weight="700" fill="#34d399">Cumulative Word Point Total</text>
      <text y="22" fill="#94a3b8">Zero Combat Damage Dealt</text>
      <text y="44" fill="#94a3b8">No Power Card RNG Drops</text>
      <text y="66" fill="#94a3b8">+50 Bingo Bonus Decides Victory</text>
    </g>

    <!-- Bottom Tag -->
    <g transform="translate(18, 255)">
      <rect width="225" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="112" y="17" fill="#34d399" font-family="'Inter', sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">
        ROUNDS: 7 TO 500
      </text>
    </g>
  </g>

  <!-- CARD 3: CLASSIC TOURNAMENT (CLASSIC) -->
  <g transform="translate(605, 42)" filter="url(#modeShadow)">
    <rect width="265" height="300" rx="14" fill="url(#modeClassicBg)" stroke="#38bdf8" stroke-width="1.5" class="anim-pulse-blue"/>
    <!-- Card Header Banner -->
    <rect x="0" y="0" width="265" height="40" rx="14" fill="#1e40af" fill-opacity="0.5"/>
    <text x="18" y="26" fill="#93c5fd" font-family="'Inter', sans-serif" font-size="13" font-weight="900" letter-spacing="1">
      CLASSIC SCORING
    </text>
    <rect x="175" y="9" width="76" height="22" rx="11" fill="#1e3a8a" stroke="#38bdf8" stroke-width="1"/>
    <text x="213" y="23.5" fill="#e0f2fe" font-family="'Inter', sans-serif" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">LEXICON</text>

    <!-- Subtitle -->
    <text x="18" y="66" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="14.5" font-weight="800">Scrabble Standard</text>
    <text x="18" y="85" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11.5" font-weight="500">
      Pure crossword rules without cards.
    </text>

    <!-- Lexicon Pill Demo -->
    <g transform="translate(18, 104)">
      <rect width="225" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect width="219" height="18" x="3" y="3" rx="4" fill="#0284c7" fill-opacity="0.8"/>
      <text x="112" y="16" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" text-anchor="middle" letter-spacing="1">
        100 TILES IN BAG
      </text>
    </g>

    <!-- Feature Checklist -->
    <g transform="translate(18, 150)" font-family="'Inter', sans-serif" font-size="11.5" fill="#cbd5e1">
      <text y="0" font-weight="700" fill="#38bdf8">Bag Exhaustion End Condition</text>
      <text y="22" fill="#94a3b8">CSW24 Lexicon Rules Engine</text>
      <text y="44" fill="#94a3b8">3L, 2L Multipliers Active</text>
      <text y="66" fill="#94a3b8">Pure Vocabulary Mastery</text>
    </g>

    <!-- Bottom Tag -->
    <g transform="translate(18, 255)">
      <rect width="225" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="112" y="17" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">
        TOURNAMENT RATED
      </text>
    </g>
  </g>

  <!-- CARD 4: FANCY BLOOD ARENA (FANCY) -->
  <g transform="translate(895, 42)" filter="url(#modeShadow)">
    <rect width="265" height="300" rx="14" fill="url(#modeFancyBg)" stroke="#c084fc" stroke-width="1.5" class="anim-pulse-purple"/>
    <!-- Card Header Banner -->
    <rect x="0" y="0" width="265" height="40" rx="14" fill="#6b21a8" fill-opacity="0.5"/>
    <text x="18" y="26" fill="#e9d5ff" font-family="'Inter', sans-serif" font-size="13" font-weight="900" letter-spacing="1">
      FANCY ARENA
    </text>
    <rect x="175" y="9" width="76" height="22" rx="11" fill="#581c87" stroke="#c084fc" stroke-width="1"/>
    <text x="213" y="23.5" fill="#fae8ff" font-family="'Inter', sans-serif" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">MAYHEM</text>

    <!-- Subtitle -->
    <text x="18" y="66" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="14.5" font-weight="800">Auto-Spells Per Turn</text>
    <text x="18" y="85" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11.5" font-weight="500">
      High HP pool with automatic card draw.
    </text>

    <!-- Fancy Demo Pill -->
    <g transform="translate(18, 104)">
      <rect width="225" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect width="219" height="18" x="3" y="3" rx="4" fill="#9333ea" fill-opacity="0.8"/>
      <text x="112" y="16" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" text-anchor="middle" letter-spacing="1">
        1 AUTO-SPELL / TURN
      </text>
    </g>

    <!-- Feature Checklist -->
    <g transform="translate(18, 150)" font-family="'Inter', sans-serif" font-size="11.5" fill="#cbd5e1">
      <text y="0" font-weight="700" fill="#c084fc">150 Default High HP Pool</text>
      <text y="22" fill="#94a3b8">Draws 1 Random Card on Turn Start</text>
      <text y="44" fill="#94a3b8">No Board Power Cells Needed</text>
      <text y="66" fill="#94a3b8">Aggressive Elimination Fights</text>
    </g>

    <!-- Bottom Tag -->
    <g transform="translate(18, 255)">
      <rect width="225" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="112" y="17" fill="#c084fc" font-family="'Inter', sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">
        CHAOTIC ARENA
      </text>
    </g>
  </g>

</svg>
