  <defs>
    <radialGradient id="teamBg" cx="50%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#0b1329" stop-opacity="0.98"/>
      <stop offset="45%" stop-color="#060913" stop-opacity="0.99"/>
      <stop offset="100%" stop-color="#020408" stop-opacity="1"/>
